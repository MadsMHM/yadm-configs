prSections:
    - title: My Pull Requests
      filters: is:open author:@me
    - title: Needs My Review
      filters: is:open review-requested:@me
    - title: Involved
      filters: is:open involves:@me -author:@me
    - title: All Open (mhm)
      filters: is:open org:mediehusenemidtjylland archived:false
issuesSections:
    - title: My Issues
      filters: is:open author:@me
    - title: Assigned
      filters: is:open assignee:@me
    - title: Involved
      filters: is:open involves:@me -author:@me
notificationsSections:
    - title: All
      filters: ""
    - title: Created
      filters: reason:author
    - title: Participating
      filters: reason:participating
    - title: Mentioned
      filters: reason:mention
    - title: Review Requested
      filters: reason:review-requested
    - title: Assigned
      filters: reason:assign
    - title: Subscribed
      filters: reason:subscribed
    - title: Team Mentioned
      filters: reason:team-mention
repo:
    branchesRefetchIntervalSeconds: 30
    prsRefetchIntervalSeconds: 60
defaults:
    preview:
        open: true
        width: 0.45
    prsLimit: 20
    prApproveComment: LGTM
    issuesLimit: 20
    notificationsLimit: 20
    view: prs
    layout:
        prs:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 20
            author:
                width: 15
            authorIcon:
                hidden: false
            assignees:
                width: 20
                hidden: true
            base:
                width: 15
                hidden: true
            lines:
                width: 15
        issues:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 15
            creator:
                width: 10
            creatorIcon:
                hidden: false
            assignees:
                width: 20
                hidden: true
    refetchIntervalMinutes: 30
keybindings:
    universal:
        - key: g
          name: lazygit
          command: cd {{.RepoPath}}; lazygit
    prs:
        # check out the PR and open diffnav in a "#<pr>" tab in the repo's Rex session
        - key: D
          name: review in Rex
          command: ~/.config/rex/scripts/review.sh '{{.RepoPath}}' '{{.RepoName}}' {{.PrNumber}}
repoPaths:
    mediehusenemidtjylland/*: /Users/madsskautrupjacobsen/Desktop/dev/*
theme:
    ui:
        sectionsShowCount: true
        table:
            showSeparator: true
            compact: false
    # Tokyo Night Storm, as Rex
    colors:
        text:
            primary: "#c0caf5"
            secondary: "#7aa2f7"
            inverted: "#24283b"
            faint: "#565f89"
            warning: "#e0af68"
            success: "#9ece6a"
            error: "#f7768e"
        background:
            selected: "#292e42"
        border:
            primary: "#7aa2f7"
            secondary: "#3b4261"
            faint: "#292e42"
pager:
    diff: diffnav
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true
includeReadNotifications: true
