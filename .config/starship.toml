"$schema" = "https://starship.rs/config-schema.json"

# One line: bolt, dir, branch, status, lang versions, ❯ — Tokyo Night colors, no blocks
add_newline = false
format = """\
[ ](orange)\
$directory\
$git_branch\
$git_status\
$nodejs\
$bun\
$rust\
$golang\
$docker_context\
$cmd_duration\
$character"""

palette = "tokyonight"

[palettes.tokyonight]
fg = "#c0caf5"
comment = "#565f89"
blue = "#7aa2f7"
cyan = "#7dcfff"
magenta = "#bb9af7"
green = "#9ece6a"
yellow = "#e0af68"
orange = "#ff9e64"
red = "#f7768e"

[directory]
style = "bold blue"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"dev" = "󰲋 "

[git_branch]
symbol = ""
format = "[$symbol $branch]($style) "
style = "magenta"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "red"

[nodejs]
symbol = ""
format = "[$symbol ($version) ](green)"

[bun]
symbol = ""
format = "[$symbol ($version) ](yellow)"

[rust]
symbol = "󱘗"
format = "[$symbol ($version) ](orange)"

[golang]
symbol = ""
format = "[$symbol ($version) ](cyan)"

[docker_context]
symbol = ""
format = "[$symbol $context]($style) "
style = "cyan"

[cmd_duration]
format = "[ $duration]($style) "
style = "comment"
show_notifications = true
min_time_to_notify = 45000

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
