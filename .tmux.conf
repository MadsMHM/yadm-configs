# ---- General ----
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'   # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # undercurl colors
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 0
set -g display-time 4000          # show messages for 4s (default 750ms)
set -g status-interval 5          # refresh status bar every 5s (default 15s)
set -g focus-events on            # pass focus events to programs (neovim etc.)
setw -g aggressive-resize on      # better window sizing with multiple sessions
set -g status-keys emacs          # emacs keys in tmux command prompt

# ---- Prefix ----
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix

# ---- Copy mode (vi + macOS clipboard) ----
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# ---- Popups ----
bind g display-popup -E -w 80% -h 80% "lazygit"
bind y display-popup -E -w 80% -h 80% "yazi"
bind b display-popup -E -w 80% -h 80% "btop"
bind t display-popup -E -w 80% -h 80%

# ---- Status bar ----
set -g status-position top
set -g status-style "bg=#1f2335,fg=#a9b1d6"

# Left: session name + cwd
set -g status-left "#[fg=#1f2335,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#1f2335] #[fg=#565f89]#(echo #{pane_current_path} | sed \"s|$HOME|~|\") "
set -g status-left-length 50

# Window list
set -g window-status-format "#[fg=#565f89] #I:#W "
set -g window-status-current-format "#[fg=#7aa2f7,bg=#292e42,bold] #I:#W #[bg=#1f2335]"
set -g window-status-separator ""

# Right: spotify, cpu, ram, date/time
set -g status-right "#[fg=#7dcfff]#(~/.config/tmux/scripts/spotify.sh) #[fg=#3b4261]│ #[fg=#565f89]CPU #(~/.config/tmux/scripts/cpu.sh) #[fg=#3b4261]│ #[fg=#565f89]RAM #(~/.config/tmux/scripts/ram.sh) #[fg=#3b4261]│ #[fg=#565f89]%d/%m/%Y #[fg=#a9b1d6]%H:%M "
set -g status-right-length 120

# Pane borders
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# Message style
set -g message-style "bg=#292e42,fg=#c0caf5"

# ---- Plugins ----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-sessionx'
# sessionx options stored via run-shell so $HOME expands at load time
# (tmux's own set -g doesn't expand env vars in option values)
run-shell 'tmux set-option -g @sessionx-x-path "$HOME/Desktop/dev"'
run-shell 'tmux set-option -g @sessionx-custom-paths "$HOME/Desktop/dev"'
set -g @sessionx-custom-paths-subdirectories 'true'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# ---- Initialize TPM (keep at bottom) ----
run '~/.tmux/plugins/tpm/tpm'
